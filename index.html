  <style>
    :root {
      --bg: #0e0d0c;
      --surface: #171412;
      --surface-2: #1e1a17;
      --line: rgba(244, 162, 126, 0.2);
      --line-soft: rgba(242, 236, 233, 0.08);
      --accent: #f4a27e;
      --accent-soft: #f7c3ab;
      --ink: #141110;
      --text: #f2ece9;
      --muted: #a89c95;
      --faint: #74695f;
      --serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --sans: 'Gotham', 'Gotham SSm A', 'Montserrat', system-ui, sans-serif;
      --jp: 'Shippori Mincho', 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      --nav-h: 62px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    img { display: block; }

    .page { max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 120px; }

    /* ---------- Portada ---------- */
    .hero { position: relative; height: min(64vh, 480px); min-height: 340px; overflow: hidden; }
    .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .hero::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(14,13,12,0.35) 0%, rgba(14,13,12,0.15) 35%, rgba(14,13,12,0.85) 78%, var(--bg) 100%);
    }
    .hero-content { position: absolute; left: 0; right: 0; bottom: 34px; z-index: 1; text-align: center; padding: 0 24px; }
    .hero-kanji { font-family: var(--jp); font-weight: 600; font-size: 58px; line-height: 1; color: var(--accent); text-shadow: 0 4px 24px rgba(0,0,0,.5); }
    .hero h1 { font-weight: 700; font-size: 22px; letter-spacing: 0.55em; margin: 16px 0 0 0.55em; }
    .hero-tag { font-family: var(--serif); font-style: italic; font-size: 19px; color: #d6cbc5; margin-top: 6px; }

    .lang {
      position: absolute; top: calc(14px + env(safe-area-inset-top)); right: 14px; z-index: 2;
      display: flex; padding: 3px; border-radius: 999px;
      background: rgba(14,13,12,0.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .lang button {
      border: 0; background: transparent; color: #d6cbc5;
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      padding: 7px 11px; border-radius: 999px;
    }
    .lang button[aria-pressed="true"] { background: var(--accent); color: var(--ink); }

    /* ---------- Navegación ---------- */
    .nav {
      position: sticky; top: 0; z-index: 20; height: var(--nav-h);
      display: flex; align-items: center;
      background: rgba(14,13,12,0.92);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line-soft);
    }
    .icon-btn {
      flex: none; width: 40px; height: 40px; margin-left: 12px;
      display: grid; place-items: center;
      border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--accent);
    }
    .icon-btn svg { width: 17px; height: 17px; }
    .nav-track {
      flex: 1; display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 0 10px; scrollbar-width: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 20px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12px, #000 calc(100% - 20px), transparent);
    }
    .nav-track::-webkit-scrollbar { display: none; }
    .chip {
      flex: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
      padding: 10px 15px; border-radius: 999px; white-space: nowrap;
      transition: background .2s, color .2s, border-color .2s;
    }
    .chip.on { background: var(--accent); border-color: var(--accent); color: var(--ink); }

    .search { flex: 1; display: none; align-items: center; gap: 10px; padding: 0 12px 0 10px; }
    .nav.searching .nav-track { display: none; }
    .nav.searching .search { display: flex; }
    .search input {
      flex: 1; min-width: 0; height: 40px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: 500 15px var(--sans); padding: 0 16px; outline: none;
    }
    .search input:focus { border-color: var(--accent); }
    .search button { border: 0; background: none; color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 8px 4px; }

    /* ---------- Destacados ---------- */
    .feat-wrap { padding: 34px 0 4px; }
    .feat-wrap[hidden] { display: none; }
    .feat-head { padding: 0 22px 14px; display: flex; align-items: baseline; justify-content: space-between; }
    .kicker { font-size: 10.5px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: var(--accent); }
    .feat-title { font-family: var(--serif); font-weight: 500; font-size: 28px; line-height: 1.1; margin-top: 4px; }
    .feat {
      display: flex; gap: 12px; overflow-x: auto; padding: 0 22px 6px;
      scroll-snap-type: x mandatory; scroll-padding: 0 22px; scrollbar-width: none;
    }
    .feat::-webkit-scrollbar { display: none; }
    .feat-card { flex: 0 0 66%; scroll-snap-align: start; border: 0; background: none; text-align: left; }
    .feat-card img { width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 16px; background: var(--surface-2); }
    .feat-card span { display: block; font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.2; margin-top: 10px; }

    /* ---------- Secciones ---------- */
    .sec { padding: 44px 22px 4px; scroll-margin-top: var(--nav-h); }
    .sec[hidden] { display: none; }
    .sec-title { font-family: var(--serif); font-weight: 500; font-size: 36px; line-height: 1.1; margin-top: 6px; }
    .sec-note { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--muted); }
    .sec-head::after { content: ""; display: block; height: 1px; margin-top: 16px; background: linear-gradient(90deg, var(--line), transparent); }

    /* ---------- Platos ---------- */
    .dish {
      display: grid; grid-template-columns: 1fr 112px; gap: 16px; align-items: start;
      width: 100%; padding: 18px 0; text-align: left;
      background: none; border: 0; border-bottom: 1px solid var(--line-soft);
    }
    .dish.no-img { grid-template-columns: 1fr; cursor: default; }
    .dish[hidden] { display: none; }
    .dish:last-of-type { border-bottom: 0; }
    .dish-name { display: block; font-family: var(--serif); font-weight: 600; font-size: 20px; line-height: 1.2; }
    .dish-meta { display: block; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-top: 4px; }
    .dish-desc {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      font-size: 13px; color: var(--muted); margin-top: 5px; line-height: 1.45;
    }
    .dish.no-img .dish-desc { -webkit-line-clamp: unset; display: block; }
    .icons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .icons i {
      font-style: normal; width: 24px; height: 24px; border-radius: 50%;
      display: grid; place-items: center; font-size: 11.5px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line-soft);
    }
    .icons i.ask { border: 1px dashed var(--line); }
    .thumb { width: 112px; height: 112px; border-radius: 14px; object-fit: cover; background: var(--surface-2); }
    .empty { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--faint); padding: 20px 0; }
    .empty[hidden] { display: none; }
    .no-results { text-align: center; padding: 60px 30px; font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--muted); }
    .no-results[hidden] { display: none; }

    /* ---------- Guía de alérgenos ---------- */
    .guide-intro { font-size: 13.5px; color: var(--muted); margin: 16px 0 14px; }
    .guide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .g-item { border: 1px solid var(--line-soft); border-radius: 14px; padding: 14px; background: var(--surface); }
    .g-item.wide { grid-column: 1 / -1; }
    .g-icon { font-size: 20px; }
    .g-name { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin-top: 8px; }
    .g-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }

    footer { text-align: center; padding: 56px 24px 20px; color: var(--faint); }
    footer .f-kanji { font-family: var(--jp); font-size: 28px; color: var(--accent); opacity: .8; }
    footer .f-brand { font-size: 11px; font-weight: 600; letter-spacing: .4em; color: var(--muted); margin-top: 10px; }
    footer p { font-size: 12px; margin-top: 12px; line-height: 1.6; }

    /* ---------- Botón filtro ---------- */
    .fab {
      position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30;
      display: flex; align-items: center; gap: 10px; border: 0; border-radius: 999px;
      background: var(--accent); color: var(--ink);
      font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
      padding: 15px 24px; white-space: nowrap; box-shadow: 0 12px 32px rgba(0,0,0,.55);
    }
    .fab-count { display: none; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--accent); font-size: 11px; line-height: 20px; letter-spacing: 0; text-align: center; }
    .fab.active .fab-count { display: inline-block; }

    /* ---------- Paneles inferiores ---------- */
    .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.65); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .scrim.show { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
      max-width: 600px; margin: 0 auto; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
      background: var(--surface); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0;
      transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
      visibility: hidden;
    }
    .sheet.show { transform: none; visibility: visible; }
    .sheet-body { padding: 14px 20px calc(24px + env(safe-area-inset-bottom)); }
    .grabber { width: 38px; height: 4px; border-radius: 4px; background: var(--faint); margin: 0 auto 18px; opacity: .6; }
    .sheet h2 { font-family: var(--serif); font-weight: 500; font-size: 28px; line-height: 1.15; }
    .sheet-sub { font-size: 13px; color: var(--muted); margin: 4px 0 16px; }
    .toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .tog {
      display: flex; align-items: center; gap: 10px; padding: 12px;
      border: 1px solid var(--line-soft); border-radius: 12px; background: transparent;
      font-size: 13px; font-weight: 500; text-align: left; transition: border-color .2s, background .2s, color .2s;
    }
    .tog i { font-style: normal; font-size: 16px; }
    .tog[aria-pressed="true"] { border-color: var(--accent); background: rgba(244,162,126,.1); color: var(--accent-soft); }
    .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
    .btn { flex: 1; border-radius: 999px; padding: 14px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
    .btn-solid { background: var(--accent); border: 1px solid var(--accent); color: var(--ink); }
    .sheet-note { font-size: 11.5px; color: var(--faint); margin-top: 14px; line-height: 1.5; }

    .detail-img { position: relative; }
    .detail-img img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 22px 22px 0 0; background: var(--surface-2); }
    .close {
      position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%;
      border: 0; display: grid; place-items: center; font-size: 20px; line-height: 1;
      background: rgba(14,13,12,.65); color: var(--text); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    }
    .detail .sheet-body { padding-top: 20px; }
    .detail-cat { margin-bottom: 6px; }
    .detail-desc { font-size: 14.5px; color: var(--muted); margin-top: 10px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .chips span {
      display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted);
      border: 1px solid var(--line-soft); padding: 5px 11px 5px 8px; border-radius: 999px; background: rgba(255,255,255,.02);
    }
    .chips span.ask { border-style: dashed; border-color: var(--line); color: var(--accent-soft); }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .sheet, .scrim, .chip { transition: none; }
    }
  </style>
</head>

          en: ["Teas & infusions", "Japanese green tea, matcha, herbal teas and coffee."] },
        { es: ["Especiales de la casa", "Limonada casera de yuzu y hierbabuena, y té frío de melocotón y jazmín."],
          en: ["House specials", "Homemade yuzu and mint lemonade, and peach and jasmine iced tea."] }
      ]}
    ];

    /* =========================================================
       LÓGICA
       ========================================================= */
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const norm = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const img = (f, w) => `fotos/${f}-${w}.webp`;

    let lang = "es";
    try { lang = localStorage.getItem("mizu-lang") || (navigator.language || "es").slice(0, 2); } catch (e) {}
    if (!UI[lang]) lang = "en";

    const L = () => (lang === "es" ? 0 : 1);
    const t = (k) => UI[lang][k];
    const algName = (k) => ALERGENOS[k][lang === "es" ? 1 : 3];
    const algDesc = (k) => ALERGENOS[k][lang === "es" ? 2 : 4];

    const elegidos = new Set();
    let consulta = "";

    // índice plano de platos para abrir el detalle
    const PLATOS = [];
    CARTA.forEach((s) => s.platos.forEach((p) => { p.cat = s; PLATOS.push(p); }));

    function render() {
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
      document.querySelectorAll("[data-t-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.tAria)));
      document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
      $("#q").placeholder = t("searchPh");

      const secciones = [...CARTA.map((s) => ({ id: s.id, n: s[lang][0] })), { id: "alergenos", n: t("allergens") }];
      $("#chips").innerHTML = secciones.map((s) => `<button class="chip" type="button" data-target="${s.id}">${esc(s.n)}</button>`).join("");

      const dest = CARTA.find((s) => s.destacada);
      $("#feat").innerHTML = dest.platos.map((p) => `
        <button class="feat-card" type="button" data-i="${PLATOS.indexOf(p)}">
          <img src="${img(p.f, 480)}" alt="${esc(p[lang][0])}" loading="lazy" decoding="async" width="480" height="360">
          <span>${esc(p[lang][0])}</span>
        </button>`).join("");

      $("#menu").innerHTML = CARTA.map((s) => `
        <section class="sec" id="${s.id}">
          <div class="sec-head">
            <h2 class="sec-title">${esc(s[lang][2] || s[lang][0])}</h2>
            ${s[lang][1] ? `<div class="sec-note">${esc(s[lang][1])}</div>` : ""}
          </div>
          ${s.platos.map((p) => {
            const tag = p.f ? "button" : "div";
            return `
            <${tag} class="dish${p.f ? "" : " no-img"}" ${p.f ? `type="button" data-i="${PLATOS.indexOf(p)}"` : ""} data-a="${(p.a || []).join(" ")}" data-s="${esc(norm(p.es.join(" ") + " " + p.en.join(" ")))}">
              <span>
                <span class="dish-name">${esc(p[lang][0])}</span>
                ${p.m ? `<span class="dish-meta">${esc(p.m[L()])}</span>` : ""}
                ${p.p ? `<span class="dish-meta">${esc(p.p)}</span>` : ""}
                <span class="dish-desc">${esc(p[lang][1])}</span>
                ${p.a ? `<span class="icons">${p.a.map((k) => `<i class="${k === "consultar" ? "ask" : ""}" title="${esc(algName(k))}">${ALERGENOS[k][0]}</i>`).join("")}</span>` : ""}
              </span>
              ${p.f ? `<img class="thumb" src="${img(p.f, 480)}" alt="${esc(p[lang][0])}" loading="lazy" decoding="async" width="112" height="112">` : ""}
            </${tag}>`;
          }).join("")}
          <p class="empty" hidden>${esc(t("empty"))}</p>
        </section>`).join("") + `
        <section class="sec" id="alergenos">
          <div class="sec-head"><h2 class="sec-title">${esc(t("guideTitle"))}</h2></div>
          <p class="guide-intro">${esc(t("guideIntro"))}</p>
          <div class="guide">
            ${Object.keys(ALERGENOS).map((k) => `
              <div class="g-item${k === "consultar" ? " wide" : ""}">
                <div class="g-icon" aria-hidden="true">${ALERGENOS[k][0]}</div>
                <div class="g-name">${esc(k === "consultar" ? t("guideAsk") : algName(k))}</div>
                <div class="g-desc">${esc(algDesc(k))}</div>
              </div>`).join("")}
          </div>
        </section>`;

      $("#toggles").innerHTML = Object.keys(ALERGENOS).filter((k) => k !== "consultar").map((k) =>
        `<button class="tog" type="button" data-k="${k}" aria-pressed="${elegidos.has(k)}"><i aria-hidden="true">${ALERGENOS[k][0]}</i>${esc(algName(k))}</button>`
      ).join("");

      bindChips();
      aplicar();
    }

    function aplicar() {
      const q = norm(consulta.trim());
      let total = 0;
      document.querySelectorAll("#menu .sec").forEach((sec) => {
        if (sec.id === "alergenos") { sec.hidden = !!q; return; }
        let vis = 0;
        const items = sec.querySelectorAll(".dish");
        items.forEach((d) => {
          const alg = d.dataset.a ? d.dataset.a.split(" ") : [];
          const ok = !alg.some((k) => elegidos.has(k)) && (!q || d.dataset.s.includes(q));
          d.hidden = !ok;
          if (ok) vis++;
        });
        total += vis;
        sec.hidden = !!q && vis === 0;
        sec.querySelector(".empty").hidden = !!q || vis > 0;
      });
      $("#feat-wrap").hidden = !!q || elegidos.size > 0;
      $("#no-results").hidden = !q || total > 0;
      const n = elegidos.size;
      $("#fab").classList.toggle("active", n > 0);
      $("#fab-count").textContent = n;
      $("#fab-label").textContent = n ? t("filterOn") : t("filter");
    }

    /* ---- Navegación y sección activa ---- */
    let obs;
    function activar(id) {
      const track = $("#chips");
      track.querySelectorAll(".chip").forEach((c) => {
        const on = c.dataset.target === id;
        c.classList.toggle("on", on);
        if (on) track.scrollTo({ left: c.offsetLeft - track.clientWidth / 2 + c.clientWidth / 2, behavior: "smooth" });
      });
    }
    function bindChips() {
      $("#chips").querySelectorAll(".chip").forEach((c) =>
        c.addEventListener("click", () => {
          document.getElementById(c.dataset.target).scrollIntoView({ behavior: "smooth", block: "start" });
          activar(c.dataset.target);
        })
      );
      if (obs) obs.disconnect();
      obs = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && activar(e.target.id)), { rootMargin: "-40% 0px -55% 0px" });
      document.querySelectorAll("#menu .sec").forEach((s) => obs.observe(s));
      activar(CARTA[0].id);
    }

    /* ---- Idioma ---- */
    document.querySelectorAll(".lang button").forEach((b) =>
      b.addEventListener("click", () => {
        lang = b.dataset.lang;
        try { localStorage.setItem("mizu-lang", lang); } catch (e) {}
        render();
      })
    );

    /* ---- Búsqueda ---- */
    $("#search-open").addEventListener("click", () => {
      $("#nav").classList.add("searching");
      $("#q").focus();
      $("#nav").scrollIntoView({ block: "start" });
    });
    $("#search-close").addEventListener("click", () => {
      consulta = ""; $("#q").value = "";
      $("#nav").classList.remove("searching");
      aplicar();
    });
    $("#q").addEventListener("input", (e) => {
      consulta = e.target.value; aplicar();
      const top = $("#menu").getBoundingClientRect().top + scrollY - $("#nav").offsetHeight - 10;
      if (scrollY > top || consulta.length === 1) scrollTo({ top, behavior: "instant" });
    });

    /* ---- Paneles ---- */
    let abierto = null;
    function abrir(panel) {
      if (abierto) cerrar(true);
      abierto = panel;
      panel.classList.add("show");
      $("#scrim").classList.add("show");
      document.body.style.overflow = "hidden";
      history.pushState({ panel: true }, "");
    }
    function cerrar(sinHistorial) {
      if (!abierto) return;
      abierto.classList.remove("show");
      $("#scrim").classList.remove("show");
      document.body.style.overflow = "";
      abierto = null;
      if (!sinHistorial && history.state && history.state.panel) history.back();
    }
    window.addEventListener("popstate", () => { if (abierto) cerrar(true); });
    $("#scrim").addEventListener("click", () => cerrar());
    document.addEventListener("keydown", (e) => e.key === "Escape" && cerrar());

    /* ---- Detalle de plato ---- */
    function verPlato(i) {
      const p = PLATOS[i];
      const d = $("#d-img");
      d.src = img(p.f, 960); d.alt = p[lang][0];
      $("#d-cat").textContent = p.cat[lang][0] + (p.cat[lang][1] ? " · " + p.cat[lang][1] : "");
      $("#d-name").textContent = p[lang][0];
      $("#d-desc").textContent = p[lang][1];
      $("#d-alg").innerHTML = (p.a || []).map((k) =>
        `<span class="${k === "consultar" ? "ask" : ""}"><i aria-hidden="true" style="font-style:normal">${ALERGENOS[k][0]}</i>${esc(algName(k))}</span>`).join("");
      $("#detail").scrollTop = 0;
      abrir($("#detail"));
    }
    document.addEventListener("click", (e) => {
      const b = e.target.closest("[data-i]");
      if (b) verPlato(+b.dataset.i);
    });
    $("#d-close").addEventListener("click", () => cerrar());

    /* ---- Filtro ---- */
    $("#fab").addEventListener("click", () => abrir($("#filter")));
    $("#done").addEventListener("click", () => cerrar());
    $("#toggles").addEventListener("click", (e) => {
      const b = e.target.closest(".tog");
      if (!b) return;
      const k = b.dataset.k;
      elegidos.has(k) ? elegidos.delete(k) : elegidos.add(k);
      b.setAttribute("aria-pressed", elegidos.has(k));
      aplicar();
    });
    $("#clear").addEventListener("click", () => {
      elegidos.clear();
      $("#toggles").querySelectorAll(".tog").forEach((b) => b.setAttribute("aria-pressed", "false"));
      aplicar();
    });

    render();
  </script>
</body>
</html>
